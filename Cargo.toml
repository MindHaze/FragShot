[package]
name = "fragshot"
version = "0.1.0"
edition = "2021"
description = "Read-only CLI scanner for Telegram usernames on Fragment"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
console = "0.15"
csv = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = "0.24"
robotstxt = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml_ng = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
deunicode = "1"
ctrlc = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
